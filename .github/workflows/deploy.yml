name: Deploy Music API to Azure

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name "${{ vars.ACR_NAME }}"

      - name: Build Docker image
        run: |
          docker build \
            -t "${{ vars.ACR_LOGIN_SERVER }}/music-api:${{ github.sha }}" \
            .

      - name: Push image to ACR
        run: |
          docker push \
            "${{ vars.ACR_LOGIN_SERVER }}/music-api:${{ github.sha }}"

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --image "${{ vars.ACR_LOGIN_SERVER }}/music-api:${{ github.sha }}" \
            --output none

      - name: Show deployed image
        run: |
          az containerapp show \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --query "properties.template.containers[0].image" \
            --output tsv

      - name: Verify application health
        run: |
          curl --fail --silent --show-error \
            --retry 6 \
            --retry-delay 10 \
            --retry-all-errors \
            "${{ vars.GATEWAY_URL }}/health"
